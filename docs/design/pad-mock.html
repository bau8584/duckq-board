<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DuckQ Board 시안</title>
<style>
:root{
  --bg0:#0c0d0f; --bg1:#141619; --bg2:#1d2024; --line:#2a2e34;
  --text:#ececee; --text-dim:#8b9098; --text-faint:#565b63;
  --lit:#fff6e0;
  --board:#56B4E9;
  --font:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg0);color:var(--text);font-family:var(--font);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:var(--font)}

.app{position:relative;height:100%;display:grid;grid-template-rows:auto auto 1fr auto;padding:10px 14px 12px;gap:10px;
  background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--board) 13%,transparent),transparent 62%),var(--bg0)}

/* 상단 */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.grp{display:flex;gap:8px}.grp.r{justify-content:flex-end}
.total{font-size:13px;color:var(--text-dim);font-variant-numeric:tabular-nums}
.ibtn{height:38px;min-width:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--text-dim);font:600 13px var(--font);display:flex;align-items:center;justify-content:center;gap:6px}
.ibtn.on{color:var(--text);border-color:color-mix(in srgb,var(--board) 60%,var(--line))}
.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* 시안 전환 (비교용, 실제 앱엔 없음) */
.switch{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.switch button{border:0;background:none;color:var(--text-dim);font:700 13px var(--font);padding:7px 14px;border-radius:7px}
.switch button.on{background:var(--text);color:#111}

.tabsrow{display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:8px}
.tab{--c:#888;height:34px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg1);color:var(--text-dim);font:600 14px var(--font);display:flex;align-items:center;gap:8px}
.tab::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.tab.on{color:var(--text);background:color-mix(in srgb,var(--c) 22%,var(--bg1));border-color:var(--c)}

.stage{position:relative;display:grid;grid-template-columns:1fr 64px;gap:12px;min-height:0}
.tray{min-height:0;padding:12px;border-radius:18px;background:var(--bg1);
  border:2px solid color-mix(in srgb,var(--board) 70%,var(--bg1));
  box-shadow:inset 0 0 40px color-mix(in srgb,var(--board) 8%,transparent)}
.grid{height:100%;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,1fr);gap:10px}

/* 패드 공통 */
.pad{--h:#56B4E9;--ink:#0b0c0e;
  position:relative;border:0;border-radius:16px;padding:10px 10px 8px;display:flex;flex-direction:column;justify-content:space-between;
  text-align:center;cursor:pointer;color:var(--text);overflow:hidden;
  transition:transform .06s,background .06s,box-shadow .06s}
.pad:active{transform:scale(.975)}
.icons{display:flex;gap:6px;min-height:14px;justify-content:flex-start}
.icons svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.label{font-weight:800;font-size:clamp(16px,2.1vw,22px);line-height:1.2;letter-spacing:-.02em;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:grid;grid-template-columns:1fr auto 1fr;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;align-items:end;opacity:.7}
.meta span:first-child{text-align:left}.meta span:last-child{text-align:right}
.meta b{font-size:10px;letter-spacing:.08em;visibility:hidden}
.pad.played .meta b{visibility:visible}
.bar{position:absolute;left:10px;right:10px;bottom:24px;height:5px;border-radius:3px;background:rgba(0,0,0,.25);opacity:0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:currentColor;border-radius:3px}
.pad.playing .bar{opacity:1}

/* ① 플랫 + 점등 : 어두운 면에 색 글자·색 띠. 재생 중엔 면 전체가 켜진다 */
[data-style="1"] .pad{
  background:color-mix(in srgb,var(--h) 14%,#16181b);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 34%,transparent),inset 0 5px 0 var(--h);
  padding-top:15px}
[data-style="1"] .label{color:color-mix(in srgb,var(--h) 62%,#fff)}
[data-style="1"] .icons{color:color-mix(in srgb,var(--h) 60%,#fff)}
[data-style="1"] .pad.playing{
  background:var(--h);color:var(--ink);
  box-shadow:0 0 0 3px var(--lit),0 0 26px 2px color-mix(in srgb,var(--h) 65%,transparent)}
[data-style="1"] .pad.playing .label,[data-style="1"] .pad.playing .icons{color:var(--ink)}
[data-style="1"] .pad.playing .bar{background:color-mix(in srgb,var(--ink) 22%,transparent)}
[data-style="1"] .pad.played{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--h) 34%,transparent),inset 0 5px 0 color-mix(in srgb,var(--h) 45%,#16181b)}
[data-style="1"] .pad.played .label{opacity:.72}

/* ③ 굵은 색 블록 : 평소엔 꽉 찬 색, 재생 중엔 어두워지고 색 테두리·글자 */
[data-style="3"] .pad{background:var(--h);color:var(--ink);box-shadow:none}
[data-style="3"] .label{font-size:clamp(19px,2.6vw,28px);font-weight:900;color:var(--ink)}
[data-style="3"] .icons{color:var(--ink)}
[data-style="3"] .meta{opacity:.75}
[data-style="3"] .pad.playing{background:#0f1113;color:var(--h);box-shadow:inset 0 0 0 5px var(--h)}
[data-style="3"] .pad.playing .label,[data-style="3"] .pad.playing .icons{color:var(--h)}
[data-style="3"] .pad.playing .bar{background:rgba(255,255,255,.14);height:7px}
[data-style="3"] .pad.played{background:color-mix(in srgb,var(--h) 78%,#15171a)}

/* 마스터 */
.master{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;border-radius:16px;background:var(--bg1);border:1px solid var(--line);font-size:11px;color:var(--text-dim);letter-spacing:.06em}
.slider{position:relative;flex:1;width:12px;border-radius:6px;background:var(--bg0)}
.slider i{position:absolute;inset:0;border-radius:6px;background:#c9ccd1;opacity:.8}
.slider u{position:absolute;left:50%;top:-6px;width:40px;height:24px;margin-left:-20px;border-radius:8px;background:#f0f1f3}

/* 하단 */
.bottom{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px}
.scrub{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;font-size:13px;color:var(--text-dim);font-variant-numeric:tabular-nums}
.scrub .name{color:var(--text);font-weight:700}
.track{height:6px;border-radius:3px;background:var(--bg2);position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;width:0;background:var(--lit);border-radius:3px}
.ctl{display:flex;gap:10px}
.cbtn{width:88px;height:54px;border-radius:14px;border:0;background:var(--bg2);color:var(--text);display:flex;align-items:center;justify-content:center}
.cbtn:active{transform:scale(.96);background:#2a2e34}
.cbtn svg{width:24px;height:24px;fill:currentColor}
.cbtn.stop{color:#ff8f86}
</style>
</head>
<body data-style="1">
<div class="app" id="app">
  <div class="top">
    <div class="grp">
      <button class="ibtn" aria-label="설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14.2 3h-4.4l-.4 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9c.6.5 1.3.9 2 1.2l.4 2.6h4.4l.4-2.6c.7-.3 1.4-.7 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg></button>
      <button class="ibtn" id="lock" aria-label="편집 잠금"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>잠금</span></button>
    </div>
    <div class="total">전체 0:41:20 · 패드 24개</div>
    <div class="grp r">
      <button class="ibtn">일괄</button><button class="ibtn">복제</button><button class="ibtn">이동</button><button class="ibtn">삭제</button><button class="ibtn on">＋ 추가</button>
    </div>
  </div>

  <div class="tabsrow">
    <div class="tabs" id="tabs"></div>
    <div class="switch" id="sw"><button data-s="1" class="on">① 플랫+점등</button><button data-s="3">③ 굵은 블록</button></div>
  </div>

  <div class="stage">
    <div class="tray"><div class="grid" id="grid"></div></div>
    <div class="master"><span>MASTER</span><div class="slider"><i></i><u></u></div><span>100%</span></div>
  </div>

  <div class="bottom">
    <button class="ibtn" aria-label="전체화면"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <div class="scrub"><span class="name" id="sname">—</span><div class="track"><i id="sfill"></i></div><span id="stime">00:00 / 00:00</span></div>
    <div class="ctl">
      <button class="cbtn" aria-label="전체 일시정지"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
      <button class="cbtn stop" id="stopall" aria-label="전체 정지"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
      <button class="cbtn" aria-label="전체 페이드아웃"><svg viewBox="0 0 24 24"><path d="M3 18L21 6v12z"/></svg></button>
    </div>
  </div>
</div>

<script>
const COLORS={gray:'#9AA0A8',purple:'#CC79A7',orange:'#E69F00',green:'#00A67C',red:'#E5622A',blue:'#3E8FE0',yellow:'#F0E442',sky:'#56B4E9'};
const BOARDS=[{name:'1막',c:'sky'},{name:'2막',c:'purple'},{name:'커튼콜',c:'orange'}];
// [이름,색,길이(초),페이드인,루프,솔로,다음재생] — 페이드아웃은 대부분 켜짐이라 생략, 켜진 것만 아이콘으로 보임
const PADS=[
 ['오프닝 음악','sky',834,1,0,0,0],['환호성','yellow',6,0,0,0,0],['박수','yellow',9,0,0,0,0],['문 열림','gray',2,0,0,0,0],['문 닫힘','gray',2,0,0,0,0],['전화벨','orange',8,0,1,0,0],
 ['빗소리','blue',180,1,1,1,0],['천둥','blue',7,0,0,0,0],['새소리','green',95,0,1,1,0],['발자국','gray',4,0,0,0,0],['경고음','red',1,0,0,1,0],['사이렌','red',38,0,1,0,1],
 ['총소리','red',1,0,0,0,0],['유리 깨짐','red',3,0,0,0,0],['심장 소리','purple',39,0,1,1,0],['종소리','orange',5,0,0,0,0],['웃음소리','yellow',5,0,0,0,0],['엔딩 음악','sky',574,1,0,0,1],
 ['이명','purple',4,0,0,0,0],['자동차','gray',22,0,0,0,0],['마이크 잡음','gray',3,0,0,0,0],['놀람','green',2,0,0,0,0],['정적','blue',60,0,0,0,0],['미정','gray',2,0,0,0,0]];
const IC={
 fi:'<svg viewBox="0 0 24 24"><path d="M3 19L21 5v14z"/></svg>',
 so:'<svg viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>',
 lp:'<svg viewBox="0 0 24 24"><path d="M17 3l3 3-3 3"/><path d="M4 11V9a3 3 0 0 1 3-3h13"/><path d="M7 21l-3-3 3-3"/><path d="M20 13v2a3 3 0 0 1-3 3H4"/></svg>',
 nx:'<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'};
const ink=h=>{const[r,g,b]=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:((v+.055)/1.055)**2.4);
  const L=.2126*r+.7152*g+.0722*b;return (1.05/(L+.05))>((L+.05)/.05)?'#ffffff':'#0b0c0e'};
const fmt=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const app=document.getElementById('app'),grid=document.getElementById('grid'),tabs=document.getElementById('tabs');
const st=[];let last=null;

function setBoard(i){app.style.setProperty('--board',COLORS[BOARDS[i].c]);[...tabs.children].forEach((t,k)=>t.classList.toggle('on',k===i))}
BOARDS.forEach((b,i)=>{const t=document.createElement('button');t.className='tab';t.textContent=b.name;t.style.setProperty('--c',COLORS[b.c]);t.onclick=()=>setBoard(i);tabs.appendChild(t)});

PADS.forEach((p,i)=>{
  const[name,col,len,fi,lp,so,nx]=p,h=COLORS[col];
  const el=document.createElement('button');el.className='pad';el.style.setProperty('--h',h);el.style.setProperty('--ink',ink(h));
  el.innerHTML=`<div class="icons">${fi?IC.fi:''}${so?IC.so:''}${lp?IC.lp:''}${nx?IC.nx:''}</div>
    <div class="label">${name}</div><div class="bar"><i></i></div>
    <div class="meta"><span>00:00</span><b>PLAYED</b><span>-${fmt(len)}</span></div>`;
  st[i]={el,len,t:0,on:false,played:false};
  el.onclick=()=>{const s=st[i];s.on=!s.on;if(s.on)last=i;else{s.played=true;s.t=0}render(i)};
  grid.appendChild(el);
});
st[0].on=true;st[0].t=140;st[6].on=true;st[6].t=40;last=0;
[3,10,16,20].forEach(i=>st[i].played=true);
function render(i){const s=st[i];s.el.classList.toggle('playing',s.on);s.el.classList.toggle('played',s.played&&!s.on)}
PADS.forEach((p,i)=>render(i));
setInterval(()=>{
  st.forEach((s,i)=>{if(!s.on)return;s.t+=.25;if(s.t>=s.len){s.on=false;s.played=true;s.t=0;render(i)}
    s.el.querySelector('.bar i').style.width=(s.t/s.len*100)+'%';
    s.el.querySelector('.meta span:first-child').textContent=fmt(s.t);
    s.el.querySelector('.meta span:last-child').textContent='-'+fmt(s.len-s.t)});
  if(last!==null){const s=st[last];sname.textContent=PADS[last][0];sfill.style.width=(s.t/s.len*100)+'%';stime.textContent=fmt(s.t)+' / '+fmt(s.len)}
},250);
stopall.onclick=()=>st.forEach((s,i)=>{if(s.on){s.on=false;s.played=true;s.t=0;render(i)}});
lock.onclick=e=>e.currentTarget.classList.toggle('on');
sw.onclick=e=>{const b=e.target.closest('button');if(!b)return;document.body.dataset.style=b.dataset.s;[...sw.children].forEach(x=>x.classList.toggle('on',x===b))};
setBoard(0);
</script>
</body>
</html>
