<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DuckQ Board 시안</title>
<style>
:root{
  --bg0:#0c0d0f; --bg1:#141619; --bg2:#1d2024; --line:#2a2e34;
  --text:#ececee; --text-dim:#8b9098; --text-faint:#565b63;
  --lit:#fff6e0;
  --board:#56B4E9;
  --font:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
}
/* 라이트: 차가운 밝은 회색 바탕 + 흰 껍데기. 색 8종은 그대로 */
[data-theme="light"]{
  --bg0:#e9ecf0; --bg1:#f6f7f9; --bg2:#ffffff; --line:#d3d8df;
  --text:#15181c; --text-dim:#59616b; --text-faint:#9099a4;
  --lit:#15181c;
  --pad-idle:#ffffff; --label-mix:#000; --label-pct:42%; --btn-press:#e4e7ec; --stop:#d2372b; --knob:#ffffff; --slider:#7a838f;
}
:root{--pad-idle:#16181b;--label-mix:#fff;--label-pct:62%;--btn-press:#2a2e34;--stop:#ff8f86;--knob:#f0f1f3;--slider:#c9ccd1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg0);color:var(--text);font-family:var(--font);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:var(--font)}

.app{position:relative;height:100%;display:grid;grid-template-rows:auto auto 1fr auto;padding:10px 14px 12px;gap:10px;
  background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--board) 13%,transparent),transparent 62%),var(--bg0)}

/* 상단 */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.grp{display:flex;gap:8px}.grp.r{justify-content:flex-end}
.total{font-size:13px;color:var(--text-dim);font-variant-numeric:tabular-nums}
.ibtn{height:38px;min-width:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--text-dim);font:600 13px var(--font);display:flex;align-items:center;justify-content:center;gap:6px}
.ibtn.on{color:var(--text);border-color:color-mix(in srgb,var(--board) 60%,var(--line))}
.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* 시안 전환 (비교용, 실제 앱엔 없음) */
.switch{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.switch button{border:0;background:none;color:var(--text-dim);font:700 13px var(--font);padding:7px 14px;border-radius:7px}
.switch button.on{background:var(--text);color:#111}

.tabsrow{display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:8px}
.tab{--c:#888;height:34px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg1);color:var(--text-dim);font:600 14px var(--font);display:flex;align-items:center;gap:8px}
.tab::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.tab.on{color:var(--text);background:color-mix(in srgb,var(--c) 22%,var(--bg1));border-color:var(--c)}

.stage{position:relative;display:grid;grid-template-columns:1fr 64px;gap:12px;min-height:0}
.tray{min-height:0;padding:12px;border-radius:18px;background:var(--bg1);
  border:2px solid color-mix(in srgb,var(--board) 70%,var(--bg1));
  box-shadow:inset 0 0 40px color-mix(in srgb,var(--board) 8%,transparent)}
.grid{height:100%;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,1fr);gap:10px}

/* 패드 공통 */
.pad{--h:#56B4E9;--ink:#0b0c0e;
  position:relative;border:0;border-radius:16px;padding:10px 10px 8px;display:flex;flex-direction:column;justify-content:space-between;
  text-align:center;cursor:pointer;color:var(--text);overflow:hidden;
  transition:transform .06s,background .06s,box-shadow .06s}
.pad:active{transform:scale(.975)}
.icons{display:flex;gap:6px;min-height:14px;justify-content:flex-start}
.icons svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.label{font-weight:800;font-size:clamp(16px,2.1vw,22px);line-height:1.2;letter-spacing:-.02em;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:grid;grid-template-columns:1fr auto 1fr;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;align-items:end;opacity:.7}
.meta span:first-child{text-align:left}.meta span:last-child{text-align:right}
.meta b{font-size:10px;letter-spacing:.08em;visibility:hidden}
.pad.played .meta b{visibility:visible}
.bar{position:absolute;left:10px;right:10px;bottom:24px;height:5px;border-radius:3px;background:rgba(0,0,0,.25);opacity:0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:currentColor;border-radius:3px}
.pad.playing .bar{opacity:1}

/* ③ 굵은 색 블록 + 하드웨어 패드 디테일
   평소: 꽉 찬 색 · 안쪽 얇은 테두리(베젤) · 번호 · 옵션 칩
   재생 중: 면이 어두워지고 색이 테두리·글자·레벨미터로 옮겨간다 */
[data-style="3"] .pad{background:var(--h);color:var(--ink);border-radius:20px;padding:12px 12px 9px;box-shadow:none}
[data-style="3"] .icons,[data-style="3"] .label,[data-style="3"] .meta{position:relative}
[data-style="3"] .label{font-size:clamp(19px,2.6vw,28px);font-weight:900;letter-spacing:-.03em}
[data-style="3"] .icons{gap:4px;padding-right:34px}
[data-style="3"] .icons svg{width:22px;height:22px;padding:4px;border-radius:7px;background:color-mix(in srgb,var(--ink) 14%,transparent);opacity:1}
[data-style="1"] .idx,[data-style="1"] .eq,[data-style="4"] .idx,[data-style="4"] .eq{display:none!important}
.idx{position:absolute;top:11px;right:14px;font:800 11px ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.04em;opacity:.5}
.eq{position:absolute;top:11px;right:13px;display:none;gap:2.5px;align-items:flex-end;height:16px}
.eq i{width:4px;background:currentColor;border-radius:2px;height:5px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-duration:.6s;animation-delay:-.2s}.eq i:nth-child(3){animation-duration:1.1s;animation-delay:-.5s}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}
[data-style="3"] .meta{opacity:.78}
/* 재생 중: 색은 그대로 유지하고 더 밝아지며, 진행한 만큼 밝은 색이 왼쪽에서 차오른다. 테두리 없음 */
[data-style="3"] .pad.playing{--p:0%;
  background:linear-gradient(90deg,color-mix(in srgb,var(--h) 58%,#fff) var(--p),var(--h) var(--p));
  transform:scale(1.035);z-index:2;
  box-shadow:0 10px 26px -2px color-mix(in srgb,var(--h) 70%,transparent),0 2px 6px rgba(0,0,0,.25)}
[data-style="3"] .pad.playing .idx{display:none}
[data-style="3"] .pad.playing .eq{display:flex}
[data-style="3"] .pad.playing .bar{display:none}
[data-style="3"] .pad.played{background:color-mix(in srgb,var(--h) 70%,var(--bg0))}
[data-style="3"] .pad.played .meta b{background:color-mix(in srgb,var(--ink) 16%,transparent);padding:2px 6px;border-radius:5px;visibility:visible}

/* ① 플랫 : 그라데이션 없음. 평소엔 어두운 무채색 면 + 왼쪽 굵은 색 띠 + 색 글자.
   재생 중엔 면 전체가 색으로 차오르고(반전) 진행 바가 채워진다 → 평소와 재생 중이 정반대라 구분이 확실 */
[data-style="1"] .pad{background:var(--pad-idle);border-radius:16px;padding:10px 12px 9px 20px;
  box-shadow:inset 0 0 0 1px var(--line),inset 9px 0 0 var(--h)}
[data-style="1"] .icons,[data-style="1"] .label,[data-style="1"] .meta{position:relative}
[data-style="1"] .label{color:color-mix(in srgb,var(--h) var(--label-pct),var(--label-mix));text-align:left;font-size:clamp(16px,2.1vw,22px)}
[data-style="1"] .icons{color:color-mix(in srgb,var(--h) var(--label-pct),var(--label-mix))}
[data-style="1"] .pad.playing{background:var(--h);color:var(--ink);box-shadow:0 0 0 3px var(--lit),0 0 24px 2px color-mix(in srgb,var(--h) 55%,transparent)}
[data-style="1"] .pad.playing .label,[data-style="1"] .pad.playing .icons{color:var(--ink)}
[data-style="1"] .pad.playing .bar{background:color-mix(in srgb,var(--ink) 22%,transparent);left:20px}
[data-style="1"] .pad.played{box-shadow:inset 0 0 0 1px var(--line),inset 9px 0 0 color-mix(in srgb,var(--h) 40%,var(--pad-idle))}
[data-style="1"] .pad.played .label{opacity:.7}
[data-style="1"] .meta{padding-left:0}

/* ① 화이트: 흰 면 → 색이 차오르고 색 그림자가 번진다. 검은 테두리 없음 */
[data-theme="light"][data-style="1"] .pad{background:#f3f5f8;box-shadow:inset 0 0 0 1px var(--line),inset 9px 0 0 var(--h)}
[data-theme="light"][data-style="1"] .pad.playing{background:var(--h);transform:scale(1.03);z-index:2;
  box-shadow:0 12px 28px -4px color-mix(in srgb,var(--h) 80%,transparent),0 2px 6px rgba(0,0,0,.22)}
[data-theme="light"][data-style="1"] .pad.played{box-shadow:inset 0 0 0 1px var(--line),inset 9px 0 0 color-mix(in srgb,var(--h) 40%,#f3f5f8)}

/* ④ 글래스 : 반사 돔·아래 색 번짐 제거. 단색 반투명 면 + 가는 밝은 테두리 + 얇은 빛줄기.
   재생 중엔 색으로 차오르며 테두리가 밝아진다 (흐림 효과는 쓰지 않음) */
[data-style="4"] .pad{border-radius:22px;
  background:linear-gradient(115deg,rgba(255,255,255,.16) 0,rgba(255,255,255,0) 34%),color-mix(in srgb,var(--h) 48%,var(--pad-idle));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),inset 0 1px 0 rgba(255,255,255,.45)}
[data-style="4"] .icons,[data-style="4"] .label,[data-style="4"] .meta{position:relative}
[data-style="4"] .label{color:var(--text)}
[data-style="4"] .icons{color:var(--text)}
[data-style="4"] .pad.playing{background:linear-gradient(115deg,rgba(255,255,255,.28) 0,rgba(255,255,255,0) 40%),var(--h);color:var(--ink);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.9),0 0 26px 2px color-mix(in srgb,var(--h) 60%,transparent)}
[data-style="4"] .pad.playing .label,[data-style="4"] .pad.playing .icons{color:var(--ink)}
[data-style="4"] .pad.playing .bar{background:color-mix(in srgb,var(--ink) 22%,transparent)}
[data-style="4"] .pad.played{filter:saturate(.55)}
[data-theme="light"][data-style="4"] .pad{background:linear-gradient(115deg,rgba(255,255,255,.7) 0,rgba(255,255,255,0) 40%),color-mix(in srgb,var(--h) 30%,#fff);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.95),0 4px 14px color-mix(in srgb,var(--h) 30%,transparent)}
[data-theme="light"][data-style="4"] .label,[data-theme="light"][data-style="4"] .icons{color:color-mix(in srgb,var(--h) 30%,#000)}
[data-theme="light"][data-style="4"] .pad.playing .label,[data-theme="light"][data-style="4"] .pad.playing .icons{color:var(--ink)}

/* 마스터 */
.master{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;border-radius:16px;background:var(--bg1);border:1px solid var(--line);font-size:11px;color:var(--text-dim);letter-spacing:.06em}
.slider{position:relative;flex:1;width:12px;border-radius:6px;background:var(--bg0)}
.slider i{position:absolute;inset:0;border-radius:6px;background:var(--slider);opacity:.8}
.slider u{position:absolute;left:50%;top:-6px;width:40px;height:24px;margin-left:-20px;border-radius:8px;background:var(--knob);border:1px solid var(--line)}

/* 하단 */
.bottom{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px}
.scrub{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;font-size:13px;color:var(--text-dim);font-variant-numeric:tabular-nums}
.scrub .name{color:var(--text);font-weight:700}
.track{height:6px;border-radius:3px;background:var(--bg2);position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;width:0;background:var(--lit);border-radius:3px}
.ctl{display:flex;gap:10px}
.cbtn{width:88px;height:54px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);color:var(--text);display:flex;align-items:center;justify-content:center}
.cbtn:active{transform:scale(.96);background:var(--btn-press)}
.cbtn svg{width:24px;height:24px;fill:currentColor}
.cbtn.stop{color:var(--stop)}
[data-theme="light"] .switch button.on{background:#15181c;color:#fff}
[data-theme="light"][data-style="4"] .pad.playing{
  background:linear-gradient(115deg,rgba(255,255,255,.35) 0,rgba(255,255,255,0) 40%),var(--h);color:var(--ink);transform:scale(1.03);z-index:2;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.9),0 12px 28px -4px color-mix(in srgb,var(--h) 80%,transparent)}
[data-theme="light"][data-style="4"] .pad{background:linear-gradient(115deg,rgba(255,255,255,.7) 0,rgba(255,255,255,0) 40%),color-mix(in srgb,var(--h) 16%,#fff)}
[data-theme="light"][data-style="4"] .pad.playing{background:linear-gradient(115deg,rgba(255,255,255,.35) 0,rgba(255,255,255,0) 40%),var(--h)}

/* 색 조합 세트 (중립 바탕 + 8색). A는 기본값 */
[data-palette="B"]{--bg0:#0d1017;--bg1:#151a23;--bg2:#1e2430;--line:#2b3342;--pad-idle:#171c26}
[data-palette="B"][data-theme="light"]{--bg0:#e9edf4;--bg1:#f7f9fc;--bg2:#ffffff;--line:#d1d9e6;--pad-idle:#ffffff}
[data-palette="C"]{--bg0:#08090a;--bg1:#101113;--bg2:#1a1b1e;--line:#27292d;--pad-idle:#121315}
[data-palette="C"][data-theme="light"]{--bg0:#efefef;--bg1:#fafafa;--bg2:#ffffff;--line:#dadada;--pad-idle:#ffffff}

/* 색 없음 패드: 평소엔 중립, 재생 중엔 보드 색으로 켜진다(--h가 보드 색) */
[data-style="1"] .pad.none:not(.playing){box-shadow:inset 0 0 0 1px var(--line)}
[data-style="1"] .pad.none:not(.playing) .label,[data-style="1"] .pad.none:not(.playing) .icons{color:var(--text)}
[data-style="1"] .pad.none{padding-left:12px}
[data-style="1"] .pad.none .label{text-align:center}
[data-style="1"] .pad.none.playing .bar{left:10px}
[data-style="3"] .pad.none:not(.playing):not(.played){background:color-mix(in srgb,var(--text) 15%,var(--bg1));color:var(--text)}
[data-style="3"] .pad.none:not(.playing) .icons svg{background:color-mix(in srgb,var(--text) 14%,transparent)}
[data-style="3"] .pad.none.played{background:color-mix(in srgb,var(--text) 9%,var(--bg1));color:var(--text)}
[data-style="4"] .pad.none:not(.playing){background:linear-gradient(115deg,rgba(255,255,255,.14) 0,rgba(255,255,255,0) 34%),color-mix(in srgb,var(--text) 12%,var(--pad-idle))}
[data-theme="light"][data-style="4"] .pad.none:not(.playing){background:linear-gradient(115deg,rgba(255,255,255,.8) 0,rgba(255,255,255,0) 40%),color-mix(in srgb,var(--text) 6%,#fff)}
[data-theme="light"][data-style="4"] .pad.none:not(.playing) .label,[data-theme="light"][data-style="4"] .pad.none:not(.playing) .icons{color:var(--text)}
[data-theme="light"][data-style="3"] .pad.none:not(.playing):not(.played){background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
</style>
</head>
<body data-style="3" data-palette="A">
<div class="app" id="app">
  <div class="top">
    <div class="grp">
      <button class="ibtn" aria-label="설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14.2 3h-4.4l-.4 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9c.6.5 1.3.9 2 1.2l.4 2.6h4.4l.4-2.6c.7-.3 1.4-.7 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg></button>
      <button class="ibtn" id="lock" aria-label="편집 잠금"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>잠금</span></button>
    </div>
    <div class="total">전체 0:41:20 · 패드 24개</div>
    <div class="grp r">
      <button class="ibtn">일괄</button><button class="ibtn">복제</button><button class="ibtn">이동</button><button class="ibtn">삭제</button><button class="ibtn on">＋ 추가</button>
    </div>
  </div>

  <div class="tabsrow">
    <div class="tabs" id="tabs"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
      <div class="switch" id="sw"><button data-s="1">① 플랫</button><button data-s="3" class="on">③ 굵은 블록</button><button data-s="4">④ 글래스</button></div>
      <div class="switch" id="pl"><button data-p="A" class="on">색 A</button><button data-p="B">색 B</button><button data-p="C">색 C</button></div>
      <div class="switch" id="th"><button data-t="dark" class="on">다크</button><button data-t="light">화이트</button></div>
    </div>
  </div>

  <div class="stage">
    <div class="tray"><div class="grid" id="grid"></div></div>
    <div class="master"><span>MASTER</span><div class="slider"><i></i><u></u></div><span>100%</span></div>
  </div>

  <div class="bottom">
    <button class="ibtn" aria-label="전체화면"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <div class="scrub"><span class="name" id="sname">—</span><div class="track"><i id="sfill"></i></div><span id="stime">00:00 / 00:00</span></div>
    <div class="ctl">
      <button class="cbtn" aria-label="전체 일시정지"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
      <button class="cbtn stop" id="stopall" aria-label="전체 정지"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
      <button class="cbtn" aria-label="전체 페이드아웃"><svg viewBox="0 0 24 24"><path d="M3 18L21 6v12z"/></svg></button>
    </div>
  </div>
</div>

<script>
const PALS={
 A:{gray:'#9AA0A8',purple:'#CC79A7',orange:'#E69F00',green:'#00A67C',red:'#E5622A',blue:'#3E8FE0',yellow:'#F0E442',sky:'#56B4E9'}, // 색각이상 안전(Okabe-Ito 기반)
 B:{gray:'#9AA3AF',purple:'#B57EDC',orange:'#F08C3A',green:'#4FBF8B',red:'#EF5B5B',blue:'#5B8DEF',yellow:'#F2C94C',sky:'#4FC3E0'}, // 모던 앱
 C:{gray:'#B8C0CC',purple:'#D16BFF',orange:'#FF8A1F',green:'#2EE59D',red:'#FF4D5E',blue:'#3D7BFF',yellow:'#FFE14D',sky:'#38D5FF'}  // 네온 무대
};
const COLORS=Object.assign({},PALS.A);
const BOARDS=[{name:'1막',c:'sky'},{name:'2막',c:'purple'},{name:'커튼콜',c:'orange'}];
// [이름,색,길이(초),페이드인,루프,솔로,다음재생] — 페이드아웃은 대부분 켜짐이라 생략, 켜진 것만 아이콘으로 보임
const PADS=[
 ['오프닝 음악','sky',834,1,0,0,0],['환호성','none',6,0,0,0,0],['박수','none',9,0,0,0,0],['문 열림','none',2,0,0,0,0],['문 닫힘','none',2,0,0,0,0],['전화벨','yellow',8,0,1,0,0],
 ['빗소리','none',180,1,1,1,0],['천둥','none',7,0,0,0,0],['새소리','none',95,0,1,1,0],['발자국','none',4,0,0,0,0],['경고음','red',1,0,0,1,0],['사이렌','red',38,0,1,0,1],
 ['총소리','none',1,0,0,0,0],['유리 깨짐','none',3,0,0,0,0],['심장 소리','none',39,0,1,1,0],['종소리','none',5,0,0,0,0],['웃음소리','none',5,0,0,0,0],['엔딩 음악','sky',574,1,0,0,1],
 ['이명','none',4,0,0,0,0],['자동차','none',22,0,0,0,0],['마이크 잡음','none',3,0,0,0,0],['놀람','none',2,0,0,0,0],['정적','none',60,0,0,0,0],['미정','none',2,0,0,0,0]];
const IC={
 fi:'<svg viewBox="0 0 24 24"><path d="M3 19L21 5v14z"/></svg>',
 so:'<svg viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>',
 lp:'<svg viewBox="0 0 24 24"><path d="M17 3l3 3-3 3"/><path d="M4 11V9a3 3 0 0 1 3-3h13"/><path d="M7 21l-3-3 3-3"/><path d="M20 13v2a3 3 0 0 1-3 3H4"/></svg>',
 nx:'<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'};
const ink=h=>{const[r,g,b]=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:((v+.055)/1.055)**2.4);
  const L=.2126*r+.7152*g+.0722*b;return (1.05/(L+.05))>((L+.05)/.05)?'#ffffff':'#0b0c0e'};
const fmt=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const app=document.getElementById('app'),grid=document.getElementById('grid'),tabs=document.getElementById('tabs');
const st=[];let last=null;

let curB=0;
function paint(i){const s=st[i];if(!s)return;const none=s.col==='none';const h=none?COLORS[BOARDS[curB].c]:COLORS[s.col];
  s.el.classList.toggle('none',none);s.el.style.setProperty('--h',h);s.el.style.setProperty('--ink',ink(h))}
function setBoard(i){curB=i;app.style.setProperty('--board',COLORS[BOARDS[i].c]);[...tabs.children].forEach((t,k)=>t.classList.toggle('on',k===i));st.forEach((_,k)=>paint(k))}
function recolorTabs(){[...tabs.children].forEach((t,k)=>t.style.setProperty('--c',COLORS[BOARDS[k].c]))}
BOARDS.forEach((b,i)=>{const t=document.createElement('button');t.className='tab';t.textContent=b.name;t.style.setProperty('--c',COLORS[b.c]);t.onclick=()=>setBoard(i);tabs.appendChild(t)});

PADS.forEach((p,i)=>{
  const[name,col,len,fi,lp,so,nx]=p;
  const el=document.createElement('button');el.className='pad';
  el.innerHTML=`<div class="icons">${fi?IC.fi:''}${so?IC.so:''}${lp?IC.lp:''}${nx?IC.nx:''}</div>
    <div class="idx">${String(i+1).padStart(2,'0')}</div><div class="eq"><i></i><i></i><i></i></div>
    <div class="label">${name}</div><div class="bar"><i></i></div>
    <div class="meta"><span>00:00</span><b>PLAYED</b><span>-${fmt(len)}</span></div>`;
  st[i]={el,len,col,t:0,on:false,played:false};
  el.onclick=()=>{const s=st[i];s.on=!s.on;if(s.on)last=i;else{s.played=true;s.t=0}render(i)};
  grid.appendChild(el);
});
st[0].on=true;st[0].t=140;st[6].on=true;st[6].t=40;last=0;
[3,10,16,20].forEach(i=>st[i].played=true);
function render(i){const s=st[i];s.el.classList.toggle('playing',s.on);s.el.classList.toggle('played',s.played&&!s.on)}
PADS.forEach((p,i)=>render(i));
setInterval(()=>{
  st.forEach((s,i)=>{if(!s.on)return;s.t+=.25;if(s.t>=s.len){s.on=false;s.played=true;s.t=0;render(i)}
    s.el.querySelector('.bar i').style.width=(s.t/s.len*100)+'%';s.el.style.setProperty('--p',(s.t/s.len*100)+'%');
    s.el.querySelector('.meta span:first-child').textContent=fmt(s.t);
    s.el.querySelector('.meta span:last-child').textContent='-'+fmt(s.len-s.t)});
  if(last!==null){const s=st[last];sname.textContent=PADS[last][0];sfill.style.width=(s.t/s.len*100)+'%';stime.textContent=fmt(s.t)+' / '+fmt(s.len)}
},250);
stopall.onclick=()=>st.forEach((s,i)=>{if(s.on){s.on=false;s.played=true;s.t=0;render(i)}});
lock.onclick=e=>e.currentTarget.classList.toggle('on');
sw.onclick=e=>{const b=e.target.closest('button');if(!b)return;document.body.dataset.style=b.dataset.s;[...sw.children].forEach(x=>x.classList.toggle('on',x===b))};
th.onclick=e=>{const b=e.target.closest('button');if(!b)return;document.body.dataset.theme=b.dataset.t;[...th.children].forEach(x=>x.classList.toggle('on',x===b))};
pl.onclick=e=>{const b=e.target.closest('button');if(!b)return;document.body.dataset.palette=b.dataset.p;Object.assign(COLORS,PALS[b.dataset.p]);[...pl.children].forEach(x=>x.classList.toggle('on',x===b));recolorTabs();setBoard(curB)};
setBoard(0);
</script>
</body>
</html>
