<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>DuckQ 엔진 검증</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font: 15px/1.4 -apple-system, system-ui, sans-serif; background: #111; color: #eee; padding: 12px; padding-bottom: 40vh; user-select: none; -webkit-user-select: none; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  html, body, button, label { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  button { font: inherit; padding: 10px 14px; border: 0; border-radius: 8px; background: #333; color: #eee; cursor: pointer; }
  button:active { background: #555; }
  button.primary { background: #2a6; color: #000; font-weight: 700; }
  button.danger { background: #a33; }
  button:disabled { opacity: .4; }
  label.file { display: inline-block; padding: 10px 14px; background: #36a; border-radius: 8px; cursor: pointer; }
  label.file input { display: none; }
  .stat { background: #222; border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .stat.warn { background: #a52; }
  .stat.bad { background: #a22; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin: 12px 0; }
  .pad { position: relative; height: 84px; border-radius: 10px; background: #2a2a2a; border: 2px solid #444; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 6px; cursor: pointer; touch-action: manipulation; }
  .pad.sfx { border-color: #38a; }
  .pad.long { border-color: #a83; }
  .pad.playing { border-color: #fff; background: #3a3a3a; box-shadow: 0 0 0 2px #fff inset; }
  .pad.fading { border-color: #fa0; }
  .pad .name { font-size: 12px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all; }
  .pad .meta { font-size: 10px; color: #aaa; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .pad .bar { position: absolute; left: 0; bottom: 0; height: 4px; background: #2a6; width: 100%; transform: scaleX(0); transform-origin: left; }
  #mission { background: #1c2330; border: 1px solid #2d4a6b; border-radius: 10px; padding: 10px; margin: 10px 0; }
  #mList { display: flex; flex-wrap: wrap; gap: 6px; }
  #mList button { padding: 8px 10px; font-size: 14px; }
  #mList button.sel { background: #36a; }
  #mList button.done::after { content: ' ✅'; }
  #mList button.auto { border: 1px solid #2a6; }
  #mBody { margin-top: 10px; display: none; }
  #mTitle { font-weight: 700; font-size: 16px; }
  #mGuide { color: #cde; font-size: 14px; margin: 6px 0; white-space: pre-line; }
  #mProg { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 6px 0; }
  #mFeel { display: none; margin-top: 8px; }
  #mFeel button { margin: 0 4px 4px 0; }
  #mFeel button.sel { background: #36a; }
  #mMemo { width: 100%; font: inherit; padding: 8px; margin: 4px 0; border-radius: 6px; border: 1px solid #444; background: #111; color: #eee; -webkit-user-select: text; user-select: text; }
  #log { position: fixed; left: 0; right: 0; bottom: 0; height: 36vh; background: #000; color: #9f9; font: 11px/1.35 ui-monospace, Menlo, monospace; overflow-y: auto; padding: 8px; border-top: 1px solid #333; white-space: pre-wrap; word-break: break-all; user-select: text; -webkit-user-select: text; }
  .row button.sel { background: #36a; }
  #log .e { color: #f66; } #log .w { color: #fc6; } #log .i { color: #9cf; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: flex; align-items: center; justify-content: center; z-index: 9; }
  #overlay button { font-size: 28px; padding: 30px 60px; }
</style>
</head>
<body>
<div id="overlay"><button class="primary" id="btnStart">▶ 시작 (오디오 켜기)</button></div>

<h1>DuckQ 엔진 검증 <small id="ver" style="color:#888;font-weight:400"></small></h1>

<div class="row">
  <label class="file">＋ 파일 넣기<input type="file" id="files" multiple accept="audio/*,video/*,.m4a,.mp3,.wav,.aac,.ogg"></label>
  <button id="btnStopAll" class="danger">■ 전체 정지</button>
  <button id="btnFadeAll">◣ 전체 페이드</button>
  <button id="btnClear">DB 비우기</button>
</div>
<div class="row">
  <span>긴 곡 방식:</span>
  <button id="btnModeA">A 스트림(지금)</button>
  <button id="btnModeD">D 직접 풀기</button>
</div>
<div id="mission">
  <div id="mList"></div>
  <div id="mBody">
    <div id="mTitle"></div>
    <div id="mGuide"></div>
    <div id="mProg"></div>
    <button id="mStart" class="primary">시작</button>
    <button id="mEnd" disabled>끝</button>
    <div id="mFeel">
      <div>어땠나요?</div>
      <div id="mFeelBtns"></div>
      <input id="mMemo" placeholder="한 줄 메모 (안 써도 됨)">
      <button id="mSave" class="primary">기록</button>
    </div>
  </div>
</div>

<div class="row">
  <span class="stat" id="stCtx">ctx: -</span>
  <span class="stat" id="stLoad">적재: 0 MB</span>
  <span class="stat" id="stWake">wake: -</span>
  <span class="stat" id="stLat">지연 효과음 avg - / max - (n=0)</span>
  <span class="stat" id="stLatL">지연 긴곡 avg - / max - (n=0)</span>
  <span class="stat" id="stJank">메인스레드 멈춤(>100ms): 0</span>
  <span class="stat" id="stUi">화면 반영 avg - / max - (n=0)</span>
  <span class="stat" id="stFrames">끊긴 프레임(>50ms): 0</span>
  <span class="stat" id="stPlaying">재생 중 0</span>
</div>
<div class="row">
  <button id="btnBurst">자동 연타 300회</button>
  <button id="btnBurstStop" disabled>연타 중지</button>
  <button id="btnPress">압박: 효과음 +100MB 적재</button>
  <button id="btnCopy">로그 복사</button>
  <button id="btnDl">로그 저장</button>
  <button id="btnMark">마크 찍기</button>
  <button id="btnImport">이전 로그 PC로 보내기</button>
</div>
<div id="importBox" style="display:none;margin:8px 0">
  <textarea id="importText" rows="6" style="width:100%;font:12px monospace" placeholder="예전 로그를 여기에 붙여넣기"></textarea>
  <button id="btnImportSend" class="primary">보내기</button>
</div>

<div id="grid"></div>
<div id="log"></div>

<script>
'use strict';
const VER = 'engine-test 0.4.1 (2026-09-29)';
const SFX_MAX_SEC = 30;          // 이 이하 → 메모리 적재(AudioBuffer), 초과 → 스트리밍(<audio>)
const FADE_SEC = 2;
const WARN_BYTES = 300 * 1024 * 1024;
const $ = id => document.getElementById(id);
$('ver').textContent = VER;

// ---------- 로그 ----------
const logLines = [];
const t0 = performance.now();
function log(msg, cls) {
  const t = ((performance.now() - t0) / 1000).toFixed(3).padStart(9);
  const line = `[${t}] ${msg}`;
  logLines.push(line);
  logQueue.push([line, cls]);
  if (!logRaf) logRaf = requestAnimationFrame(flushLogDom);
}
// 탭마다 로그 창을 다시 그리면 화면이 버벅여서, 한 프레임에 모아 한 번만 붙인다.
const logQueue = []; let logRaf = 0;
function flushLogDom() {
  logRaf = 0;
  const box = $('log');
  const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  const frag = document.createDocumentFragment();
  for (const [line, cls] of logQueue.splice(0)) {
    const el = document.createElement('div');
    if (cls) el.className = cls;
    el.textContent = line; frag.appendChild(el);
  }
  box.appendChild(frag);
  while (box.childElementCount > 300) box.removeChild(box.firstChild);
  if (atBottom) box.scrollTop = box.scrollHeight;
}
window.addEventListener('error', e => log('JS 오류: ' + e.message + ' @' + e.lineno, 'e'));
window.addEventListener('unhandledrejection', e => log('Promise 오류: ' + (e.reason && e.reason.message || e.reason), 'e'));

log(VER, 'i');
log('UA: ' + navigator.userAgent, 'i');
log(`화면 ${screen.width}x${screen.height} dpr${devicePixelRatio} · standalone=${navigator.standalone === true || matchMedia('(display-mode: standalone)').matches} · mem=${navigator.deviceMemory || '?'}GB · cpu=${navigator.hardwareConcurrency || '?'}`, 'i');
if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(e => log(`저장소 사용 ${(e.usage/1048576).toFixed(1)}MB / 한도 ${(e.quota/1048576).toFixed(0)}MB`, 'i'));
// 긴 곡을 '직접 풀기(WebCodecs)'로 틀 수 있는지 형식별로 확인 — 스트림 방식 대안 고르기용
(async () => {
  if (!('AudioDecoder' in window)) return log('직접 풀기(AudioDecoder) 없음', 'w');
  const codecs = { mp3: 'mp3', 'aac(m4a)': 'mp4a.40.2', opus: 'opus', flac: 'flac', vorbis: 'vorbis', 'pcm(wav)': 'pcm-s16' };
  const res = [];
  for (const [name, codec] of Object.entries(codecs)) {
    let ok = false;
    for (const sampleRate of [44100, 48000]) {
      try { ok = ok || (await AudioDecoder.isConfigSupported({ codec, sampleRate, numberOfChannels: 2 })).supported; } catch {}
    }
    res.push(`${name} ${ok ? '⭕' : '❌'}`);
  }
  const mms = window.ManagedMediaSource || window.MediaSource;
  res.push(`MediaSource(mp3) ${mms && mms.isTypeSupported && mms.isTypeSupported('audio/mpeg') ? '⭕' : '❌'}${window.ManagedMediaSource ? '(Managed)' : ''}`);
  log('직접 풀기 지원: ' + res.join(' · '), 'i');
})();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(ok => log('persist 저장소 ' + (ok ? '허용' : '거부'), ok ? 'i' : 'w'));

// ---------- IndexedDB ----------
let db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('duckq-engine-test', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('files', { keyPath: 'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function idb(mode, fn) {
  return new Promise((res, rej) => {
    const tx = db.transaction('files', mode);
    const st = tx.objectStore('files');
    const req = fn(st);
    tx.oncomplete = () => res(req && req.result);
    tx.onerror = () => rej(tx.error);
  });
}

// ---------- 오디오 엔진 ----------
let ctx, master;
const tracks = [];        // {id,name,size,dur,kind:'sfx'|'long',blob,buffer?,el?,node?,gain?,playing,startedAt,fading}
let loadedBytes = 0;
const lat = { sfx: [], long: [] };
let jank = 0;

function ensureCtx() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    master = ctx.createGain();
    master.connect(ctx.destination);
    ctx.onstatechange = () => {
      log(`ctx.state → ${ctx.state}`, ctx.state === 'running' ? 'i' : 'w');
      if (ctx.state !== 'running' && ctx.state !== 'closed') {
        ctx.resume().then(() => log('ctx.resume() 자동 복귀 OK'), e => log('ctx.resume() 실패: ' + e.message, 'e'));
      }
    };
    log(`AudioContext 생성 sr=${ctx.sampleRate} base=${(ctx.baseLatency*1000).toFixed(1)}ms out=${((ctx.outputLatency||0)*1000).toFixed(1)}ms`, 'i');
  }
  return ctx.resume();
}
function updCtx() { $('stCtx').textContent = 'ctx: ' + (ctx ? ctx.state : '-'); }
setInterval(updCtx, 500);

function fmtMB(b) { return (b / 1048576).toFixed(1) + ' MB'; }
function updLoad() {
  const s = $('stLoad');
  s.textContent = '적재: ' + fmtMB(loadedBytes);
  s.className = 'stat' + (loadedBytes > WARN_BYTES ? ' bad' : loadedBytes > WARN_BYTES * .8 ? ' warn' : '');
}
function updLat() {
  const f = (arr, el, label) => {
    if (!arr.length) return;
    const avg = arr.reduce((a, b) => a + b, 0) / arr.length, max = Math.max(...arr);
    el.textContent = `지연 ${label} avg ${avg.toFixed(1)} / max ${max.toFixed(1)}ms (n=${arr.length})`;
    const lim = label === '효과음' ? 20 : 100;
    el.className = 'stat' + (avg > lim ? ' bad' : max > lim * 2.5 ? ' warn' : '');
  };
  f(lat.sfx, $('stLat'), '효과음'); f(lat.long, $('stLatL'), '긴곡');
}
function updPlaying() { $('stPlaying').textContent = '재생 중 ' + tracks.filter(t => t.playing).length; }

function probeDuration(blob) {
  return new Promise(res => {
    const a = new Audio(); const u = URL.createObjectURL(blob);
    const done = d => { URL.revokeObjectURL(u); a.src = ''; res(d); };
    a.preload = 'metadata';
    a.onloadedmetadata = () => done(isFinite(a.duration) ? a.duration : 9999);
    a.onerror = () => done(-1);
    a.src = u;
  });
}

async function addTrack(rec, fromDB) {
  const t = { id: rec.id, name: rec.name, size: rec.size, blob: rec.blob, dur: rec.dur, kind: rec.kind, playing: false, fading: false };
  const s = performance.now();
  if (t.kind === 'sfx') {
    try {
      const buf = await ctx.decodeAudioData(await rec.blob.arrayBuffer());
      t.buffer = buf;
      const bytes = buf.length * buf.numberOfChannels * 4;
      loadedBytes += bytes; updLoad();
      log(`효과음 적재 "${t.name}" ${t.dur.toFixed(1)}s ${fmtMB(bytes)} (${(performance.now()-s).toFixed(0)}ms) 총 ${fmtMB(loadedBytes)}`);
      if (loadedBytes > WARN_BYTES) log(`⚠ 적재 총량 ${fmtMB(loadedBytes)} > 300MB 경고`, 'w');
    } catch (e) { log(`디코딩 실패 "${t.name}": ${e.message}`, 'e'); return; }
  } else {
    t.gain = ctx.createGain(); t.gain.connect(master);
    try { t.d = await probeD(t); } catch (e) { t.d = null; log(`D 살펴보기 실패 "${t.name}": ${e.message}`, 'w'); }
    if (longMode === 'A' || !t.d) ensureEl(t);   // D로 틀 곡엔 <audio>를 안 만든다 (놀고 있는 <audio>가 D 소리를 흔듦 — 3회차)
    log(`긴 곡 등록 "${t.name}" ${(t.dur/60).toFixed(1)}분 ${fmtMB(t.size)} · ` + (t.d ? `D 가능 ${t.d.fmt} ${t.d.sr}Hz ${t.d.ch}ch` + (t.d.sr !== ctx.sampleRate ? ` (ctx ${ctx.sampleRate}Hz로 변환)` : '') : 'D 불가 → A만'));
  }
  tracks.push(t);
  makePad(t);
  return t;
}

// 방식 A용 <audio>. D로 틀 때는 없어야 한다: 뒤에서 파일을 읽다 멈칫(stalled)하면 화면·D 소리가 같이 튄다.
function ensureEl(t) {
  if (t.el) return t.el;
  t.url = URL.createObjectURL(t.blob);
  const el = new Audio(); el.preload = 'auto'; el.src = t.url; el.crossOrigin = 'anonymous';
  ['stalled', 'waiting', 'suspend', 'error', 'ended'].forEach(ev => el.addEventListener(ev, () => {
    if (t.el !== el) return;
    if (ev === 'ended') { t.playing = false; setPad(t); updPlaying(); log(`끝남 "${t.name}"`); }
    else if (ev === 'error') log(`<audio> error "${t.name}" code=${el.error && el.error.code}`, 'e');
    else log(`<audio> ${ev} "${t.name}" @${el.currentTime.toFixed(1)}s` + (t.playing ? '' : ' (재생 안 하는 중)'), 'w');
  }));
  t.el = el;
  t.node = ctx.createMediaElementSource(el); t.node.connect(t.gain);
  return el;
}
function dropEl(t) {
  if (!t.el) return;
  const el = t.el; t.el = null;
  el.pause(); el.removeAttribute('src'); el.load();
  try { t.node.disconnect(); } catch {}
  t.node = null; URL.revokeObjectURL(t.url);
}

function makePad(t) {
  const d = document.createElement('div');
  d.className = 'pad ' + t.kind; d.id = 'pad-' + t.id;
  d.innerHTML = `<div class="name"></div><div class="meta"></div><div class="bar"></div>`;
  d.querySelector('.name').textContent = t.name;
  d.querySelector('.meta').textContent = (t.kind === 'sfx' ? t.dur.toFixed(1) + 's · 메모리' : (t.dur/60).toFixed(1) + '분 · ' + (t.d ? 'D ' + t.d.fmt : 'A만'));
  d.addEventListener('pointerdown', e => { e.preventDefault(); tap(t, e.timeStamp); });
  $('grid').appendChild(d);
  t.pad = d; t.bar = d.querySelector('.bar');
}
function setPad(t) {
  t.pad.classList.toggle('playing', t.playing);
  t.pad.classList.toggle('fading', t.fading);
  if (!t.playing) t.bar.style.transform = 'scaleX(0)';
}

// 손가락 닿음 → 화면에 불 켜짐/꺼짐까지. 소유자가 느낀 '켜고 끌 때 렉'을 잰다.
const uiLat = [];
function tap(t, touchTs) {
  if (!ctx) return;
  const inWait = touchTs != null ? performance.now() - touchTs : 0;   // 손 닿고 코드가 불리기까지
  if (touchTs != null && t.kind === 'sfx') missionTap();   // 페이드 중 무시되는 탭도 센다
  let what;
  if (t.playing && !t.fading) { fadeOut(t); what = '끔'; }
  else if (t.playing && t.fading) return;   // 페이드 중엔 무시
  else { play(t); what = '켬'; }
  if (touchTs == null || document.visibilityState !== 'visible') return;   // 숨겨진 화면은 그리지 않아 잴 수 없음
  requestAnimationFrame(() => requestAnimationFrame(() => {   // 두 번째 프레임 = 바뀐 화면이 실제로 그려진 뒤
    const ui = performance.now() - touchTs;
    uiLat.push(ui); updUi();
    log(`화면 ${what} "${t.name}" ${ui.toFixed(0)}ms (입력 대기 ${inWait.toFixed(0)})`, ui > 100 ? 'w' : undefined);
  }));
}
function updUi() {
  const avg = uiLat.reduce((a, b) => a + b, 0) / uiLat.length, max = Math.max(...uiLat);
  $('stUi').textContent = `화면 반영 avg ${avg.toFixed(0)} / max ${max.toFixed(0)}ms (n=${uiLat.length})`;
  $('stUi').className = 'stat' + (avg > 100 ? ' bad' : max > 200 ? ' warn' : '');
}

function play(t, offset) {
  const tapPerf = performance.now();
  if (ctx.state !== 'running') { log('탭 시 ctx.state=' + ctx.state + ' → resume', 'w'); ctx.resume(); }
  t.playing = true; t.fading = false; t.startedAt = performance.now() - (offset || 0) * 1000;
  if (t.kind === 'sfx') {
    const src = ctx.createBufferSource(); src.buffer = t.buffer;
    const g = ctx.createGain(); src.connect(g); g.connect(master);
    t.src = src; t.gain = g;
    src.onended = () => { if (t.src === src) { t.playing = false; t.fading = false; setPad(t); updPlaying(); } };
    src.start();
    // 지연 = 코드 실행까지 + 오디오 하드웨어 지연(base+output). 실제 스피커 소리와 가장 가까운 추정치.
    const code = performance.now() - tapPerf, hw = (ctx.baseLatency + (ctx.outputLatency || 0)) * 1000, ms = code + hw;
    lat.sfx.push(ms); updLat();
    log(`GO 효과음 "${t.name}" 지연 ${ms.toFixed(1)}ms (코드 ${code.toFixed(1)} + 장치 ${hw.toFixed(1)})`);
  } else if (longMode === 'D' && t.d) {
    t.gain.gain.cancelScheduledValues(ctx.currentTime); t.gain.gain.setValueAtTime(1, ctx.currentTime);
    playD(t, offset || 0, tapPerf);
  } else {
    if (longMode === 'D') log(`D 불가 형식 → A로 "${t.name}"`, 'w');
    const el = ensureEl(t);
    t.gain.gain.cancelScheduledValues(ctx.currentTime); t.gain.gain.setValueAtTime(1, ctx.currentTime);
    if (offset != null) el.currentTime = offset; else if (el.ended || el.currentTime >= el.duration - 0.05) el.currentTime = 0;
    const onPlaying = () => {
      el.removeEventListener('playing', onPlaying);
      const code = performance.now() - tapPerf, hw = (ctx.baseLatency + (ctx.outputLatency || 0)) * 1000, ms = code + hw;
      lat.long.push(ms); updLat();
      log(`GO 긴 곡 "${t.name}" @${el.currentTime.toFixed(1)}s 지연 ${ms.toFixed(1)}ms (코드 ${code.toFixed(1)} + 장치 ${hw.toFixed(1)})`);
    };
    el.addEventListener('playing', onPlaying);
    el.play().catch(e => { log(`play() 거부 "${t.name}": ${e.message}`, 'e'); t.playing = false; setPad(t); });
  }
  setPad(t); updPlaying();
}

function fadeOut(t) {
  if (!t.playing) return;
  t.fading = true; setPad(t);
  const now = ctx.currentTime;
  t.gain.gain.cancelScheduledValues(now);

  $('mStart').disabled = true; $('mEnd').disabled = false; $('mEnd').textContent = m.hand ? '끝' : '중단';
  $('mFeel').style.display = 'none';
  if (m.persist) { try { localStorage.setItem('duckq-pending', JSON.stringify({ id: m.id, at: Date.now() })); } catch {} }
  if (m.run) {
    try { await m.run(m); } catch (e) { log(`${m.id} 멈춤: ${e.message}`, 'e'); }
    if (m.running) endMission();
  }
}
function missionTap() {
  if (!cur || !cur.running || cur.id !== 'T1') return;
  prog(++cur.count);
  if (cur.count >= cur.goal) endMission();
}
function summary(m) { return summarize(m.startLat); }
function summarize(s) {
  const parts = [];
  const st = (a, n) => a.length ? `${n} n=${a.length} avg ${(a.reduce((x, y) => x + y, 0) / a.length).toFixed(1)} / max ${Math.max(...a).toFixed(1)}ms` : null;
  [st(lat.sfx.slice(s.sfx), '효과음 지연'), st(lat.long.slice(s.long), '긴 곡 지연'), st(uiLat.slice(s.ui), '화면 반영')].forEach(x => x && parts.push(x));
  parts.push(`끊긴 프레임 ${longFrames - s.frames}`, `메인스레드 멈춤 ${jank - s.jank}`, `적재 ${fmtMB(loadedBytes)}`);
  return parts.join(' · ');
}
function endMission() {
  const m = cur; if (!m || !m.running) return;
  m.running = false;
  if (m.persist && m.id !== 'T10') { try { localStorage.removeItem('duckq-pending'); } catch {} }
  log(`${m.id} 요약: ${summary(m)}`, 'i');
  $('mStart').disabled = true; $('mEnd').disabled = true;
  showFeel();
}
function showFeel() {
  $('mFeel').style.display = 'block'; $('mMemo').value = ''; feel = null;
  $('mFeelBtns').innerHTML = '';
  FEELS.forEach(f => {
    const b = document.createElement('button'); b.textContent = f;
    b.onclick = () => { feel = f; [...$('mFeelBtns').children].forEach(x => x.classList.toggle('sel', x === b)); };
    $('mFeelBtns').appendChild(b);
  });
}
function saveFeel() {
  const m = cur; if (!m) return;
  const memo = $('mMemo').value.trim();
  log(`===== ${m.id} 끝 · 느낌: ${feel || '-'}${memo ? ' · ' + memo : ''} =====`, 'i');
  mDone[m.id] = new Date().toISOString(); saveDone();
  $('mFeel').style.display = 'none'; $('mStart').disabled = false; $('mStart').textContent = '다시 하기';
  flushLog(); drawList();
}
// T5 튕김 · T9 강제 종료 · T10 7일: 앱을 다시 연 뒤 이어서 적는다
function missionOnOpen() {
  let t5 = null; try { t5 = localStorage.getItem('duckq-t5-mb'); localStorage.removeItem('duckq-t5-mb'); } catch {}
  if (t5) log(`T5 지난번 적재 ${t5}MB 에서 끊김 (튕김으로 봄)`, 'w');
  let p = null; try { p = JSON.parse(localStorage.getItem('duckq-pending')); } catch {}
  if (!p) return;
  const m = MISSIONS.find(x => x.id === p.id); if (!m) return;
  const days = (Date.now() - p.at) / 86400000;
  if (m.id === 'T10' && days < 7) { log(`T10 진행 중: ${days.toFixed(1)}일째 · 음원 ${tracks.length}개`, 'i'); return; }
  try { localStorage.removeItem('duckq-pending'); } catch {}
  selectMission(m);
  m.startLat = snap(); m.running = true;
  log(`${m.id} 다시 열림: 시작 뒤 ${m.id === 'T10' ? days.toFixed(1) + '일' : ((Date.now() - p.at) / 1000).toFixed(0) + '초'} · 음원 ${tracks.length}개 복원 · 페이지 열림부터 ${(performance.now() / 1000).toFixed(2)}초`, 'i');
  endMission();
}
$('mStart').onclick = startMission;
$('mEnd').onclick = endMission;
$('mSave').onclick = saveFeel;
drawList();

// ---------- PC로 자동 전송 (test/log-server.py로 열었을 때만) ----------
// github.io 에서 직접 열면 받을 곳이 없어 끈다. q.deokgu.com 에선 PC가 꺼져 있어도 쌓아 두고 계속 재시도.
let sent = 0, sendOk = location.hostname.endsWith('github.io') ? false : null;
const session = new Date().toISOString();
async function flushLog() {
  if (sendOk === false || sent >= logLines.length) return;
  const upto = logLines.length;
  const head = sent === 0 ? `\n##### 세션 ${session} #####\n` : '';
  try {
    const r = await fetch('/log', { method: 'POST', body: head + logLines.slice(sent, upto).join('\n') });
    if (!r.ok) throw new Error(r.status);
    sent = upto;
    if (sendOk === null) { sendOk = true; log('PC로 로그 자동 전송 켜짐', 'i'); }
  } catch (e) { /* PC 꺼짐 → 다음 차례에 밀린 것까지 */ }
}
setInterval(flushLog, 5000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushLog(); });
$('btnImport').onclick = () => { const b = $('importBox'); b.style.display = b.style.display === 'none' ? 'block' : 'none'; };
$('btnImportSend').onclick = async () => {
  const txt = $('importText').value.trim();
  if (!txt) return;
  try {
    const r = await fetch('/log', { method: 'POST', body: `\n##### 가져온 이전 로그 (${new Date().toISOString()}) #####\n` + txt });
    if (!r.ok) throw new Error(r.status);
    log(`이전 로그 ${txt.split('\n').length}줄 PC로 보냄`, 'i'); $('importText').value = ''; $('importBox').style.display = 'none';
  } catch (e) { log('이전 로그 전송 실패 — PC 서버 주소로 열었는지 확인: ' + e.message, 'e'); }
};
</script>
