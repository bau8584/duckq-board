<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DuckQ">
<meta name="theme-color" content="#0d1017">
<title>DuckQ Board</title>
<script>try{var s=JSON.parse(localStorage.getItem('duckq-board-v1'));if(s&&s.settings&&s.settings.theme==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
<link rel="stylesheet" href="style.css?v=0.3.30">
</head>
<body>
<div class="app" id="app">
  <!-- 윗줄: 왼쪽 보드 탭 · 오른쪽 편집류(작게) -->
  <div class="top">
    <div class="tabs" id="tabs"></div>
    <div class="grp r">
      <button class="ibtn" id="btnSet" aria-label="설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14.2 3h-4.4l-.4 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9c.6.5 1.3.9 2 1.2l.4 2.6h4.4l.4-2.6c.7-.3 1.4-.7 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg></button>
      <button class="ibtn" id="btnLock" aria-label="공연 모드 (편집 막기)"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path id="lockArc" d="M8 11V8a4 4 0 0 1 8 0"/></svg><span id="lockTxt">공연 모드</span></button>
      <button class="ibtn" id="btnEdit"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg><span>편집</span></button>
      <button class="ibtn add" id="btnAdd">＋ 추가</button>
    </div>
  </div>

  <div class="stage">
    <div class="tray" id="tray"><div class="grid" id="grid"></div></div>
    <div class="side"><div class="total" id="total"></div><div class="master" id="master"><span>MASTER</span><div class="slider" id="mSlider"><i id="mFill"></i><u id="mKnob"></u></div><span id="mVal">100%</span></div></div>
  </div>

  <div class="bottom">
    <button class="ibtn" id="btnFull" aria-label="전체화면"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <div class="plays" id="plays"></div>
    <div class="ctl">
      <button class="cbtn" id="btnPause" aria-label="전체 일시정지"><svg viewBox="0 0 24 24" id="pauseIc"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
      <button class="cbtn stop" id="btnStop" aria-label="전체 정지"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
      <button class="cbtn" id="btnFade" aria-label="전체 페이드아웃"><svg viewBox="0 0 24 24"><path d="M3 6v12h18z"/></svg></button>
    </div>
  </div>
</div>

<div class="selbar" id="selBar" hidden></div>
<div class="sheet-wrap" id="sheetWrap" hidden><div class="arw" id="sheetArw" hidden></div><div class="sheet" id="sheet"></div></div>
<div class="ov" id="startOv"><button class="go" id="btnStart">▶ 시작</button><p>소리를 켜려면 한 번 눌러 주세요</p></div>
<div class="ov" id="oustOv" hidden><p>다른 창에서 DuckQ가 열려서<br>이 창은 소리를 껐어요.</p><button class="go" id="btnReload">여기서 다시 쓰기</button></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="files" class="vh" multiple accept="audio/*,video/*,.m4a,.mp3,.wav,.aac,.ogg" tabindex="-1" aria-hidden="true">

<script src="engine.js?v=0.3.30"></script>
<script src="store.js?v=0.3.30"></script>
<script src="app.js?v=0.3.30"></script>
</body>
</html>
